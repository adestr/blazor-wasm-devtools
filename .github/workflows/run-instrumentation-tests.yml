name: Run instrumentation tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Run instrumentation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test
        run: dotnet test
        working-directory: instrumentation
