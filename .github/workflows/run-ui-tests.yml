name: Run UI tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Run UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Test
        run: pnpm test
        working-directory: ui
